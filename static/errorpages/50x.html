<!doctype html>
<!--
  502 / 503 / 504 - served by nginx itself, not by Django: gunicorn is down,
  restarting (update.sh) or too slow, so no template can run. A static copy
  of cmnsd's errorpages/base_error.html look; in English and Dutch (nginx
  can't tell the viewer's language); reloads itself after 20 seconds -
  usually enough for a restart. nginx: error_page 502 503 504 /50x.html
  (documentation/developer/webhosting.md).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="20">
  <title>Briefly unavailable</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .err-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(17,24,39,.08);
      padding: 40px 36px 36px;
      text-align: center;
    }
    .err-code {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #e5e7eb;
      line-height: 1;
      margin-bottom: 12px;
    }
    .err-heading {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 10px;
    }
    .err-body {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .err-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .err-btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s;
    }
    .err-btn--primary {
      background: #374151;
      color: #fff;
      border: 1px solid #374151;
    }
    .err-btn--primary:hover { background: #1f2937; }
    .err-btn--secondary {
      background: transparent;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    .err-btn--secondary:hover { background: #f9fafb; }
    .err-site {
      margin-bottom: 24px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="err-card">
    <div class="err-code">50x</div>
    <h1 class="err-heading">Briefly unavailable</h1>
    <div class="err-body">
      <p>The archive is being updated or is briefly unavailable. This page tries again by itself in a moment.</p>
      <p lang="nl" style="margin-top: 10px;">Het archief wordt bijgewerkt of is even niet bereikbaar. Deze pagina probeert het zo vanzelf opnieuw.</p>
    </div>
    <div class="err-actions">
      <a href="javascript:location.reload()" class="err-btn err-btn--primary">Try again · Opnieuw proberen</a>
    </div>
  </div>
</body>
</html>
