{% load markdown %}
{% comment %}
  The note's text, as Markdown - an editable block (form: NoteBodyForm),
  shown even when empty in edit mode.
{% endcomment %}
{% if note.body %}
  <div class="note-page__body reading-copy">{{ note.body|markdown }}</div>
{% elif edit_mode %}
  <p class="note-page__body edit-block__empty">{% translate "No text yet - the pencil opens it." %}</p>
{% endif %}
